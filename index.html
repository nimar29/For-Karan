html<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ultimate Quiz</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e3a8a);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            padding: 2.5rem;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            transition: all 0.5s ease;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
            color: #93c5fd;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            background: rgba(30, 58, 138, 0.4);
            color: #bfdbfe;
            border: 1px solid rgba(147, 197, 253, 0.3);
            padding: 14px 20px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #2563eb;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
        }

        .hidden {
            display: none !important;
        }

        .result-view h2 {
            font-size: 2.2rem;
            color: #60a5fa;
            margin-bottom: 1rem;
            animation: fadeInDown 0.8s ease forwards;
        }

        .result-view p {
            color: #93c5fd;
            font-style: italic;
            font-size: 1.1rem;
            opacity: 0.8;
            animation: fadeInUp 1s ease 0.3s forwards;
            animation-fill-mode: both;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container" id="quiz-card">
        <div id="question-section">
            <h1>Do you hate me?</h1>
            <div class="btn-group">
                <button onclick="revealResult()">100%</button>
                <button onclick="revealResult()">110%</button>
            </div>
        </div>

        <div id="result-section" class="result-view hidden">
            <h2>I hate you too.</h2>
            <p>🎵 Tere bin nahi lagda dil mera dholna...</p>
        </div>
    </div>

    <!-- This uses a direct audio archive stream link for the NFAK song -->
    <audio id="bg-music" src="https://archive.org" preload="auto" crossorigin="anonymous"></audio>

    <script>
        function revealResult() {
            document.getElementById('question-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');
            
            const audio = document.getElementById('bg-music');
            
            // Forces audio to load and play immediately on click
            audio.load();
            audio.play().then(() => {
                console.log("Music started playing successfully!");
            }).catch(error => {
                console.log("Playback failed. Error details:", error);
            });

            // Turn off after 60 seconds
            setTimeout(() => {
                audio.pause();
                audio.currentTime = 0;
            }, 60000);
        }
    </script>
</body>
</html>
